aid: beme
name: Beme
description: >-
  Beme Inc. (stylized "beme") was an American multimedia company founded in 2014 in New York City by
  YouTube filmmaker Casey Neistat and engineer Matt Hackett. Its mobile app, released on iOS in July
  2015 and on Android in May 2016, let users capture and instantly share unedited two-to-eight-second
  videos without previewing or editing them, aiming at a more authentic alternative to curated social
  video. Beme raised a seed round backed by Lightspeed Venture Partners and Vayner/RSE, and CNN
  acquired the company in November 2016 in a deal reported at $25 million. The consumer app was shut
  down on January 31, 2017, and on January 25, 2018 the founders departed and Beme was folded into CNN
  Digital Studios. The company is defunct. Beme never published a public API, developer portal, or API
  documentation; its only public technical artifact is an open-source Go testing utility. The beme.com
  domain has since changed hands and now redirects to an unrelated company.
